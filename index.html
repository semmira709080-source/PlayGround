<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101626">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<title>Luma e as Estrelas — jogo 2D</title>
<style>
:root{color-scheme:dark;--ink:#f7f5ff;--muted:#a8adc5;--pink:#ff77bd;--gold:#ffdf80;--mint:#7df5ce}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101626;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;touch-action:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#28334d 0,#171e31 42%,#0d1321 100%)}
#app{position:relative;width:min(100vw,calc(100vh * 1.7778));height:min(100vh,calc(100vw * .5625));aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:#111a2b;box-shadow:0 24px 80px #060912aa,0 0 0 1px #ffffff18;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding:clamp(12px,2.4vw,26px);display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;gap:10px;align-items:center;font-size:clamp(12px,1.5vw,17px);font-weight:900;letter-spacing:.08em;text-shadow:0 2px 8px #111}
.brand-mark{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#ff82c1,#fbaf8e);box-shadow:0 5px 16px #fc62aa55;font-size:19px}
.hud-right{display:flex;align-items:center;gap:clamp(8px,1.5vw,18px)}
.pill{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid #ffffff20;background:#101829bb;border-radius:999px;font-weight:800;font-size:clamp(12px,1.4vw,16px);backdrop-filter:blur(8px)}.heart{color:#ff7f9f;font-size:18px;letter-spacing:1px}.stars{color:var(--gold)}
.icon-btn{pointer-events:auto;border:1px solid #ffffff2a;color:#fff;background:#101829bb;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:16px;display:grid;place-items:center}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,#0d1426a8,#11182b55,#0d1426a8);padding:20px;transition:opacity .25s}
#overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(470px,90%);text-align:center;padding:clamp(22px,4vw,42px);border:1px solid #ffffff24;border-radius:25px;background:linear-gradient(150deg,#1d2943ed,#151d31ee);box-shadow:0 18px 70px #080c18aa, inset 0 1px #ffffff15;backdrop-filter:blur(14px)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--mint);margin:0 0 12px}.panel h1{font-size:clamp(32px,5vw,55px);line-height:.98;letter-spacing:-.05em;margin:0 0 14px}.panel h1 span{color:var(--pink)}.desc{color:#c3c8dc;line-height:1.55;font-size:clamp(13px,1.5vw,16px);margin:0 auto 22px;max-width:350px}.instructions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#aab2cb;font-size:12px;margin:0 0 22px}.instructions b{color:#fff}.play{border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(120deg,#ff75b7,#ffad8b);color:#24152b;font:900 15px/1.2 ui-rounded,"Trebuchet MS",system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 24px #fb70b466;transition:transform .15s,filter .15s}.play:hover{transform:translateY(-2px);filter:brightness(1.08)}.play:active{transform:translateY(1px)}.hint{color:#8e98b4;font-size:11px;margin:16px 0 0}
#touch-controls{position:absolute;bottom:15px;left:15px;display:none;pointer-events:none;gap:6px;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}.touch-btn{pointer-events:auto;border:1px solid #ffffff30;background:#111a2bbd;color:#fff;border-radius:13px;font-size:17px;font-weight:bold;touch-action:none;backdrop-filter:blur(5px)}.touch-btn[data-dir=up]{grid-column:2}.touch-btn[data-dir=left]{grid-column:1;grid-row:2}.touch-btn[data-dir=down]{grid-column:2;grid-row:2}.touch-btn[data-dir=right]{grid-column:3;grid-row:2}
#mobile-note{position:absolute;right:18px;bottom:24px;color:#ffffff80;font-size:11px;display:none;pointer-events:none}
@media(max-width:700px){#app{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0}#hud{padding:calc(env(safe-area-inset-top) + 12px) 14px 14px}.brand{gap:7px}.brand-mark{width:30px;height:30px}.pill{padding:7px 10px}.icon-btn{width:34px;height:34px}.panel{width:min(440px,94%)}#touch-controls{display:grid;bottom:calc(env(safe-area-inset-bottom) + 16px);left:14px}#mobile-note{display:block;bottom:calc(env(safe-area-inset-bottom) + 31px)}}
</style>
</head>
<body>
<main id="app" aria-label="Luma e as Estrelas, jogo de aventura 2D">
<canvas id="game" aria-label="Área de jogo"></canvas>
<header id="hud"><div class="brand"><div class="brand-mark">✦</div><span>LUMA <span style="color:#ff9acb">&</span> ESTRELAS</span></div><div class="hud-right"><div class="pill"><span class="stars">✦</span><span id="score">0 / 10</span></div><div class="pill"><span class="heart" id="lives">♥ ♥ ♥</span></div><button class="icon-btn" id="sound" aria-label="Ativar ou desativar som">♫</button><button class="icon-btn" id="pause" aria-label="Pausar jogo">Ⅱ</button></div></header>
<div id="overlay"><section class="panel"><p class="eyebrow">✧ uma aventura pequenina ✧</p><h1 id="title">Luma e as<br><span>Estrelas</span></h1><p class="desc" id="desc">A noite perdeu o brilho! Ajude Luma a recuperar as estrelas e fugir das sombras.</p><div class="instructions" id="instructions"><span>⌨️ <b>WASD</b> ou setas para mover</span><span>✨ Pegue 10 estrelas</span></div><button class="play" id="play">Começar aventura&nbsp; →</button><p class="hint" id="hint">Dica: use as pedras como escudo contra as sombras.</p></section></div>
<div id="touch-controls" aria-label="Controles direcionais"><button class="touch-btn" data-dir="up">▲</button><button class="touch-btn" data-dir="left">◀</button><button class="touch-btn" data-dir="down">▼</button><button class="touch-btn" data-dir="right">▶</button></div><div id="mobile-note">Mova-se e colete as estrelas ✨</div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),app=document.querySelector('#app');
const overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),instructions=document.querySelector('#instructions'),hint=document.querySelector('#hint'),playBtn=document.querySelector('#play');
const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),pauseBtn=document.querySelector('#pause'),soundBtn=document.querySelector('#sound');
const portrait=app.clientHeight>app.clientWidth,W=portrait?540:960,H=portrait?960:540,keys={},touch=new Set();let scale=1,mode='menu',score=0,lives=3,last=0,time=0,muted=false,audio=null;
let player,stars=[],shadows=[],particles=[],rocks=[],fireflies=[],screenShake=0,spawnTimer=0,invuln=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=app.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);scale=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2)}
new ResizeObserver(resize).observe(app);resize();
const arena={x:W*.05625,y:H*.1333,w:W*.8875,h:H*.7593};
function newGame(){score=0;lives=3;time=0;spawnTimer=0;invuln=0;screenShake=0;particles=[];player={x:W/2,y:H/2,r:14,vx:0,vy:0,face:0};rocks=[{x:arena.x+arena.w*.254,y:arena.y+arena.h*.239,r:28},{x:arena.x+arena.w*.711,y:arena.y+arena.h*.205,r:24},{x:arena.x+arena.w*.371,y:arena.y+arena.h*.739,r:20},{x:arena.x+arena.w*.793,y:arena.y+arena.h*.678,r:30},{x:arena.x+arena.w*.535,y:arena.y+arena.h*.361,r:14}];stars=[];shadows=[];fireflies=Array.from({length:35},()=>({x:rand(arena.x+10,arena.x+arena.w-10),y:rand(arena.y+10,arena.y+arena.h-10),p:rand(0,7),r:rand(1,2.5)}));for(let i=0;i<5;i++)spawnStar();for(let i=0;i<2;i++)spawnShadow();updateHud()}
function spawnStar(){let p;for(let i=0;i<80;i++){p={x:rand(arena.x+30,arena.x+arena.w-30),y:rand(arena.y+30,arena.y+arena.h-30),r:10,p:rand(0,7),spin:rand(0,6)};if(!rocks.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.r+30)&&(!player||Math.hypot(player.x-p.x,player.y-p.y)>90))break}stars.push(p)}
function spawnShadow(){let edge=Math.floor(rand(0,4)),x=edge===0?arena.x+12:edge===1?arena.x+arena.w-12:rand(arena.x+12,arena.x+arena.w-12),y=edge===2?arena.y+12:edge===3?arena.y+arena.h-12:rand(arena.y+12,arena.y+arena.h-12);shadows.push({x,y,r:15,v:rand(38,52)+score*1.1,phase:rand(0,7),stun:0})}
function updateHud(){scoreEl.textContent=`${score} / 10`;livesEl.textContent='♥ '.repeat(lives).trim()||'♡';livesEl.style.opacity=lives?'1':'.65'}
function showOverlay(kind){overlay.classList.remove('hidden');if(kind==='menu'){title.innerHTML='Luma e as<br><span>Estrelas</span>';desc.textContent='A noite perdeu o brilho! Ajude Luma a recuperar as estrelas e fugir das sombras.';instructions.innerHTML='<span>⌨️ <b>WASD</b> ou setas para mover</span><span>✨ Pegue 10 estrelas</span>';hint.textContent='Dica: use as pedras como escudo contra as sombras.';playBtn.textContent='Começar aventura  →'}else if(kind==='pause'){title.innerHTML='Pausa <span>✦</span>';desc.textContent='Respire um pouquinho. As estrelas podem esperar.';instructions.innerHTML='<span>Pressione <b>Esc</b> para continuar</span>';hint.textContent='';playBtn.textContent='Continuar  →'}else if(kind==='win'){title.innerHTML='Brilhou! <span>✧</span>';desc.textContent='Você devolveu o brilho ao céu! Luma e os vaga-lumes agradecem.';instructions.innerHTML=`<span>Estrelas coletadas: <b>${score}</b></span>`;hint.textContent='';playBtn.textContent='Jogar de novo  →'}else{title.innerHTML='A noite venceu <span>☾</span>';desc.textContent='As sombras ficaram mais rápidas... mas Luma acredita em você.';instructions.innerHTML=`<span>Você conseguiu <b>${score}</b> estrela${score===1?'':'s'}</span>`;hint.textContent='';playBtn.textContent='Tentar de novo  →'}}
function start(){if(mode==='pause'){mode='playing';overlay.classList.add('hidden');last=performance.now();return}newGame();mode='playing';overlay.classList.add('hidden');last=performance.now();beep(540,.08)}
function togglePause(){if(mode==='playing'){mode='pause';showOverlay('pause')}else if(mode==='pause')start()}
playBtn.addEventListener('click',start);pauseBtn.addEventListener('click',togglePause);document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='Escape')togglePause();if((e.key==='Enter'||e.key===' ')&&(mode==='menu'||mode==='over'||mode==='win'))start()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.touch-btn').forEach(b=>{const dir=b.dataset.dir;const down=e=>{e.preventDefault();touch.add(dir);b.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();touch.delete(dir)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.textContent=muted?'♫̸':'♫';soundBtn.style.opacity=muted?'.55':'1'});
function beep(freq=500,dur=.07){if(muted)return;try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(35,150);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(2,5),life:rand(.35,.8),max:.8,color})}}
function update(dt){time+=dt;if(mode!=='playing')return;invuln=Math.max(0,invuln-dt);screenShake=Math.max(0,screenShake-dt*20);
let dx=(keys.a||keys.arrowleft||touch.has('left')?-1:0)+(keys.d||keys.arrowright||touch.has('right')?1:0),dy=(keys.w||keys.arrowup||touch.has('up')?-1:0)+(keys.s||keys.arrowdown||touch.has('down')?1:0),len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const speed=205;player.vx+=(dx*speed-player.vx)*Math.min(1,dt*10);player.vy+=(dy*speed-player.vy)*Math.min(1,dt*10);player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=clamp(player.x,arena.x+player.r,arena.x+arena.w-player.r);player.y=clamp(player.y,arena.y+player.r,arena.y+arena.h-player.r);if(dx||dy)player.face=Math.atan2(dy,dx);
for(const r of rocks){let d=Math.hypot(player.x-r.x,player.y-r.y),min=player.r+r.r;if(d<min&&d>0){player.x+=(player.x-r.x)/d*(min-d);player.y+=(player.y-r.y)/d*(min-d)}}
for(let i=stars.length-1;i>=0;i--){let s=stars[i];s.p+=dt*3;s.spin+=dt*2;if(Math.hypot(player.x-s.x,player.y-s.y)<player.r+s.r+3){burst(s.x,s.y,'#ffe58d',15);stars.splice(i,1);score++;updateHud();beep(650+score*30,.12);if(score>=10){mode='win';showOverlay('win');return}spawnStar();if(score%3===0)spawnShadow()}}
for(const e of shadows){e.phase+=dt*4;if(e.stun>0){e.stun-=dt;continue}let vx=player.x-e.x,vy=player.y-e.y,d=Math.hypot(vx,vy)||1;e.x+=vx/d*e.v*dt;e.y+=vy/d*e.v*dt;for(const r of rocks){let rd=Math.hypot(e.x-r.x,e.y-r.y),min=e.r+r.r;if(rd<min&&rd>0){e.x+=(e.x-r.x)/rd*(min-rd);e.y+=(e.y-r.y)/rd*(min-rd)}}if(invuln<=0&&Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){lives--;invuln=1.6;screenShake=9;burst(player.x,player.y,'#ff729d',20);beep(180,.18);updateHud();e.stun=.65;e.x=clamp(e.x+(e.x-player.x)*1.5,arena.x+e.r,arena.x+arena.w-e.r);e.y=clamp(e.y+(e.y-player.y)*1.5,arena.y+e.r,arena.y+arena.h-e.r);if(lives<=0){mode='over';showOverlay('over');return}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.06,dt);p.vy*=Math.pow(.06,dt);p.life-=dt;if(p.life<=0)particles.splice(i,1)}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle='#111a2b';ctx.fillRect(0,0,W,H);ctx.save();if(screenShake>0)ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake));
// velvety night meadow
let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#1c2940');bg.addColorStop(.55,'#1b2b3e');bg.addColorStop(1,'#18273a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// distant soft pools of moonlight
for(const glow of [{x:W*.23,y:H*.29,r:W*.22,c:'#567ba51a'},{x:W*.76,y:H*.68,r:W*.26,c:'#468e7818'},{x:W*.52,y:H*.45,r:W*.2,c:'#ad73a111'}]){let g=ctx.createRadialGradient(glow.x,glow.y,0,glow.x,glow.y,glow.r);g.addColorStop(0,glow.c);g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.fillRect(glow.x-glow.r,glow.y-glow.r,glow.r*2,glow.r*2)}
// little grass flecks
for(let i=0;i<115;i++){let x=arena.x+14+(i*79%(arena.w-28)),y=arena.y+12+(i*137%(arena.h-24));ctx.strokeStyle=i%3?'#a4d8b012':'#ffe6ad12';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x-3,y-1,x-1,y-5);ctx.stroke()}
// arena edge
rr(arena.x,arena.y,arena.w,arena.h,23);ctx.strokeStyle='#c8e7d51a';ctx.lineWidth=2;ctx.stroke();
// winding pale path
ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([3,14]);ctx.strokeStyle='#e7e1bc0c';ctx.lineWidth=34;ctx.beginPath();ctx.moveTo(W*.1,H*.56);ctx.bezierCurveTo(W*.28,H*.48,W*.25,H*.22,W*.45,H*.29);ctx.bezierCurveTo(W*.68,H*.36,W*.6,H*.8,W*.88,H*.5);ctx.stroke();ctx.restore();
// glimmering motes
for(const f of fireflies){let a=(Math.sin(time*1.6+f.p)+1)/2;ctx.globalAlpha=.18+a*.55;ctx.fillStyle=f.p%2?'#b8ffe4':'#ffe6a4';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(f.x+Math.sin(time+f.p)*4,f.y+Math.cos(time*.8+f.p)*3,f.r*(.65+a*.45),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
// tiny plants around the clearing
for(let i=0;i<18;i++){let x=arena.x+10+(i*137%(arena.w-20)),y=arena.y+10+(i*91%(arena.h-20));if(rocks.some(r=>Math.hypot(r.x-x,r.y-y)<45))continue;ctx.save();ctx.translate(x,y);ctx.strokeStyle='#9acb9950';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,4);ctx.quadraticCurveTo(-3,-4,-1,-8);ctx.moveTo(0,1);ctx.quadraticCurveTo(6,-3,6,-6);ctx.stroke();ctx.fillStyle='#f9b9cf99';ctx.beginPath();ctx.arc(4,-8,2,0,7);ctx.fill();ctx.restore()}
// rocks
for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#0b1321a8';ctx.beginPath();ctx.ellipse(2,r.r*.72,r.r*1.18,r.r*.56,0,0,Math.PI*2);ctx.fill();let stone=ctx.createLinearGradient(-r.r,-r.r,r.r,r.r);stone.addColorStop(0,'#728396');stone.addColorStop(.5,'#485a6f');stone.addColorStop(1,'#34445a');ctx.fillStyle=stone;ctx.beginPath();ctx.ellipse(0,0,r.r,r.r*.75,-.18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a7bfce45';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-r.r*.15,-r.r*.12,r.r*.68,r.r*.45,-.18,Math.PI*1.08,Math.PI*1.8);ctx.stroke();ctx.restore()}
// collectible starbursts
for(const s of stars){let bob=Math.sin(time*3+s.p)*4,spin=s.spin;ctx.save();ctx.translate(s.x,s.y+bob);ctx.rotate(spin*.12);ctx.shadowColor='#ffe88a';ctx.shadowBlur=17;let pulse=1+Math.sin(time*5+s.p)*.09;ctx.scale(pulse,pulse);ctx.fillStyle='#fff0a5';ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?4:11;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff9d777';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,16+Math.sin(time*4+s.p)*2,0,Math.PI*2);ctx.stroke();ctx.restore()}
// shadows with wispy edges
for(const e of shadows){ctx.save();ctx.translate(e.x,e.y);let wob=Math.sin(e.phase)*2;ctx.globalAlpha=e.stun>0?.48:1;ctx.shadowColor='#15122e';ctx.shadowBlur=14;ctx.fillStyle='#4b456e';ctx.beginPath();ctx.moveTo(-e.r,-2);ctx.bezierCurveTo(-e.r-5,-e.r*.95,0,-e.r*1.5,e.r+3,-e.r*.25);ctx.bezierCurveTo(e.r+8,e.r*.35,e.r*.5,e.r+7,-2,e.r);ctx.bezierCurveTo(-e.r-7,e.r*.45,-e.r-5,e.r*.1,-e.r,-2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff9ebc';ctx.beginPath();ctx.ellipse(-4+wob*.2,-2,2.1,2.8,0,0,7);ctx.ellipse(4+wob*.2,-2,2.1,2.8,0,0,7);ctx.fill();ctx.fillStyle='#332c53';ctx.beginPath();ctx.arc(-3,-2,1,0,7);ctx.arc(5,-2,1,0,7);ctx.fill();ctx.restore()}
// Luma: bobbing little star explorer
if(player){ctx.save();ctx.translate(player.x,player.y+Math.sin(time*7)*2);ctx.rotate(player.face*.06);if(invuln>0&&Math.floor(time*15)%2)ctx.globalAlpha=.45;ctx.fillStyle='#0a1422a8';ctx.beginPath();ctx.ellipse(0,14,13,5,0,0,7);ctx.fill();ctx.shadowColor='#ffacd1';ctx.shadowBlur=invuln?25:12;ctx.fillStyle='#f27bad';ctx.beginPath();ctx.ellipse(0,2,13,14,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffb6d4';ctx.beginPath();ctx.ellipse(0,-1,10,10,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2e8';ctx.beginPath();ctx.ellipse(0,5,8,7,0,0,Math.PI);ctx.fill();ctx.fillStyle='#34253d';ctx.beginPath();ctx.ellipse(-3,2,1.3,2,0,0,7);ctx.ellipse(3,2,1.3,2,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3.4,1.3,.5,0,7);ctx.arc(2.6,1.3,.5,0,7);ctx.fill();ctx.fillStyle='#ffda91';ctx.shadowColor='#ffe397';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(3,-11);ctx.lineTo(9,-10);ctx.lineTo(4,-6);ctx.lineTo(5,-1);ctx.lineTo(0,-4);ctx.lineTo(-5,-1);ctx.lineTo(-4,-7);ctx.lineTo(-9,-10);ctx.lineTo(-3,-11);ctx.closePath();ctx.fill();ctx.restore()}
// burst particles
for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life/p.max,0,1),0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
ctx.restore();

let vg=ctx.createRadialGradient(W/2,H/2,170,W/2,H/2,620);vg.addColorStop(.55,'#050a1400');vg.addColorStop(1,'#070c19a8');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.restore()}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(mode==='playing')update(dt);else{time+=dt;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}
newGame();mode='menu';showOverlay('menu');requestAnimationFrame(frame);
